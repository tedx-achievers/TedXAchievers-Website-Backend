services:
  - type: web
    name: tedxachievers-api
    runtime: rust
    buildCommand: cargo build --release
    startCommand: ./target/release/tedxachievers
    healthCheckPath: /api/health
    envVars:
      - key: RUST_LOG
        value: info
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_SECS
        value: "900"
      - key: JWT_REFRESH_EXPIRES_SECS
        value: "2592000"
      - key: FRONTEND_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: TEDxAchievers
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
